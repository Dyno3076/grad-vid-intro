<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4/3 Graduation Intro</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        cursor: pointer;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
"use strict";

/*
    ================================================
    4/3 GRADUATION INTRO
    GitHub Pages safe version
    ================================================
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

let started = false;
let startTime = 0;

const INTRO_LENGTH = 10000;
const START_ZOOM = 7.5;


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


// --------------------------------------------------
// PLACEHOLDER CLIPS
// Each one looks different so movement is obvious.
// --------------------------------------------------

const clips = [
    {
        background: "#181818",
        foreground: "#ffffff",
        number: "01"
    },
    {
        background: "#303030",
        foreground: "#d0d0d0",
        number: "02"
    },
    {
        background: "#101010",
        foreground: "#bbbbbb",
        number: "03"
    },
    {
        background: "#3a3a3a",
        foreground: "#ffffff",
        number: "04"
    },
    {
        background: "#222222",
        foreground: "#999999",
        number: "05"
    },
    {
        background: "#454545",
        foreground: "#eeeeee",
        number: "06"
    }
];


// --------------------------------------------------
// DRAW ONE PLACEHOLDER CLIP
// --------------------------------------------------

function drawClip(x, y, size, clipIndex, time) {

    const clip = clips[clipIndex];

    ctx.save();

    ctx.translate(x, y);

    // Background
    ctx.fillStyle = clip.background;
    ctx.fillRect(
        -size / 2,
        -size / 2,
        size,
        size
    );

    // Moving stripes
    ctx.save();

    ctx.rotate(-0.35);

    const offset =
        (time * (35 + clipIndex * 12)) %
        (size * 0.5);

    ctx.strokeStyle = clip.foreground;
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = Math.max(2, size * 0.025);

    for (
        let i = -size * 2;
        i < size * 2;
        i += size * 0.18
    ) {
        ctx.beginPath();

        ctx.moveTo(
            i + offset,
            -size * 2
        );

        ctx.lineTo(
            i + offset + size,
            size * 2
        );

        ctx.stroke();
    }

    ctx.restore();


    // Fake person movement
    const bob =
        Math.sin(
            time * 4 +
            clipIndex * 1.3
        ) * size * 0.025;


    // Head
    ctx.fillStyle = clip.foreground;

    ctx.beginPath();

    ctx.arc(
        0,
        -size * 0.12 + bob,
        size * 0.12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Body
    ctx.beginPath();

    ctx.roundRect(
        -size * 0.17,
        size * 0.02 + bob,
        size * 0.34,
        size * 0.30,
        size * 0.05
    );

    ctx.fill();


    // Waving arm
    ctx.strokeStyle = clip.foreground;
    ctx.lineWidth = size * 0.065;
    ctx.lineCap = "round";

    const handY =
        -size * 0.20 +
        Math.sin(
            time * 5 +
            clipIndex
        ) * size * 0.10;

    ctx.beginPath();

    ctx.moveTo(
        size * 0.08,
        size * 0.08 + bob
    );

    ctx.lineTo(
        size * 0.27,
        handY
    );

    ctx.stroke();


    // Clip number
    ctx.globalAlpha = 0.8;
    ctx.font =
        "bold " +
        Math.max(14, size * 0.08) +
        "px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "CLIP " + clip.number,
        0,
        size * 0.40
    );

    ctx.restore();
}


// --------------------------------------------------
// 4/3 MASK
// --------------------------------------------------

function create43Mask() {

    const mask = document.createElement("canvas");

    mask.width = 1000;
    mask.height = 1000;

    const m = mask.getContext("2d");

    /*
        White = visible.
        Black = transparent.

        We draw the shape using thick strokes.
    */

    m.fillStyle = "#000";
    m.fillRect(0, 0, 1000, 1000);

    m.strokeStyle = "#fff";
    m.lineWidth = 145;
    m.lineCap = "square";
    m.lineJoin = "miter";


    // 4
    m.beginPath();

    m.moveTo(350, 120);
    m.lineTo(350, 530);
    m.lineTo(110, 530);
    m.lineTo(520, 120);
    m.lineTo(520, 880);

    m.stroke();


    // 3
    m.beginPath();

    m.moveTo(650, 170);

    m.bezierCurveTo(
        850, 80,
        890, 280,
        700, 470
    );

    m.bezierCurveTo(
        900, 500,
        900, 850,
        650, 830
    );

    m.stroke();

    return mask;
}

const maskCanvas = create43Mask();


// --------------------------------------------------
// CAMERA PATH
// --------------------------------------------------

const cameraPath = [
    { x: 0.18, y: 0.16 },
    { x: 0.36, y: 0.17 },
    { x: 0.29, y: 0.39 },
    { x: 0.51, y: 0.42 },
    { x: 0.51, y: 0.63 },
    { x: 0.75, y: 0.65 },
    { x: 0.78, y: 0.82 }
];


// --------------------------------------------------
// EASING
// --------------------------------------------------

function easeInOut(t) {

    if (t < 0.5) {
        return 2 * t * t;
    }

    return 1 -
        Math.pow(-2 * t + 2, 2) / 2;
}


// --------------------------------------------------
// CAMERA POSITION
// --------------------------------------------------

function getCameraPosition(progress) {

    const scaled =
        progress *
        (cameraPath.length - 1);

    const index = Math.min(
        Math.floor(scaled),
        cameraPath.length - 2
    );

    const local =
        scaled - index;

    const a = cameraPath[index];
    const b = cameraPath[index + 1];

    return {
        x:
            a.x +
            (b.x - a.x) * local,

        y:
            a.y +
            (b.y - a.y) * local
    };
}


// --------------------------------------------------
// DRAW THE CLIP-FILLED 4/3
// --------------------------------------------------

function drawLogo(time, zoom, cameraX, cameraY) {

    /*
        Work in a square coordinate system.
        This makes the 4/3 shape independent
        of screen resolution.
    */

    const logoSize =
        Math.min(width, height) * 1.25;

    const tileSize =
        logoSize * 0.24;


    // Temporary canvas
    const layer =
        document.createElement("canvas");

    layer.width =
        Math.ceil(width * dpr);

    layer.height =
        Math.ceil(height * dpr);

    const layerCtx =
        layer.getContext("2d");

    layerCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    // Fill the layer with moving clips
    for (
        let row = -5;
        row <= 7;
        row++
    ) {

        for (
            let col = -5;
            col <= 7;
            col++
        ) {

            const clipIndex =
                Math.abs(
                    row * 7 + col
                ) % clips.length;


            const movementX =
                Math.sin(
                    time * 1.7 +
                    row * 1.8 +
                    col
                ) *
                tileSize *
                0.10;


            const movementY =
                Math.cos(
                    time * 1.5 +
                    col * 1.4 +
                    row
                ) *
                tileSize *
                0.10;


            const x =
                width / 2 +
                col * tileSize * 0.82 +
                movementX;


            const y =
                height / 2 +
                row * tileSize * 0.82 +
                movementY;


            drawClip(
                x,
                y,
                tileSize,
                clipIndex,
                time
            );
        }
    }


    /*
        Apply the 4/3 mask.
    */

    layerCtx.globalCompositeOperation =
        "destination-in";

    layerCtx.drawImage(
        maskCanvas,
        width / 2 - logoSize / 2,
        height / 2 - logoSize / 2,
        logoSize,
        logoSize
    );


    /*
        Draw the clip-filled logo with
        the camera zoom applied.
    */

    ctx.save();

    ctx.translate(
        width / 2,
        height / 2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -cameraX,
        -cameraY
    );

    ctx.drawImage(
        layer,
        -width / 2,
        -height / 2,
        width,
        height
    );

    ctx.restore();
}


// --------------------------------------------------
// ANIMATION LOOP
// --------------------------------------------------

function animate(timestamp) {

    // Before clicking:
    // completely black screen.
    if (!started) {

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        requestAnimationFrame(animate);

        return;
    }


    const elapsed =
        timestamp - startTime;


    const rawProgress =
        Math.min(
            elapsed / INTRO_LENGTH,
            1
        );


    /*
        Smooth zoom-out.
    */

    const progress =
        easeInOut(rawProgress);


    const zoom =
        START_ZOOM -
        (START_ZOOM - 1) *
        progress;


    /*
        Camera moves through the 4/3
        while zooming out.
    */

    const camera =
        getCameraPosition(progress);


    const cameraX =
        (camera.x - 0.5) *
        Math.min(width, height);


    const cameraY =
        (camera.y - 0.5) *
        Math.min(width, height);


    // Clear screen
    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // Draw the actual clip-filled 4/3
    drawLogo(
        elapsed / 1000,
        zoom,
        cameraX,
        cameraY
    );


    /*
        IMPORTANT:

        At 100% progress we DO NOT:
        - fade to white
        - draw another 4/3
        - overlay a logo
        - flash anything

        We simply keep drawing the exact same
        clip-filled 4/3 at zoom = 1.

        This is the final frame.
    */


    requestAnimationFrame(animate);
}


// --------------------------------------------------
// START
// --------------------------------------------------

canvas.addEventListener(
    "pointerdown",
    function () {

        if (started) {
            return;
        }

        started = true;
        startTime = performance.now();

        requestAnimationFrame(animate);
    }
);


// Initial frame
ctx.fillStyle = "#000";

ctx.fillRect(
    0,
    0,
    width,
    height
);

requestAnimationFrame(animate);

</script>

</body>
</html>
