<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4/3 Graduation Intro</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: black;
        cursor: pointer;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

let started = false;
let startTime = 0;

const DURATION = 10000;
const START_ZOOM = 7.5;


// ==================================================
// RESIZE
// ==================================================

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
resize();


// ==================================================
// DIFFERENT PLACEHOLDER CLIPS
// ==================================================

const clips = [
    {
        bg: "#171717",
        fg: "#ffffff",
        id: "01"
    },
    {
        bg: "#303030",
        fg: "#d0d0d0",
        id: "02"
    },
    {
        bg: "#111111",
        fg: "#bbbbbb",
        id: "03"
    },
    {
        bg: "#3b3b3b",
        fg: "#ffffff",
        id: "04"
    },
    {
        bg: "#242424",
        fg: "#999999",
        id: "05"
    },
    {
        bg: "#454545",
        fg: "#eeeeee",
        id: "06"
    }
];


// ==================================================
// DRAW ONE CLIP
// IMPORTANT: RECEIVES A CONTEXT
// ==================================================

function drawClip(target, x, y, size, index, time) {

    const clip = clips[index];

    target.save();

    target.translate(x, y);


    // Background
    target.fillStyle = clip.bg;

    target.fillRect(
        -size / 2,
        -size / 2,
        size,
        size
    );


    // Moving stripes
    target.save();

    target.rotate(-0.35);

    const movement =
        (time * (35 + index * 10)) %
        (size * 0.45);

    target.strokeStyle = clip.fg;
    target.globalAlpha = 0.16;
    target.lineWidth = Math.max(2, size * 0.025);

    for (
        let i = -size * 2;
        i < size * 2;
        i += size * 0.18
    ) {

        target.beginPath();

        target.moveTo(
            i + movement,
            -size * 2
        );

        target.lineTo(
            i + movement + size,
            size * 2
        );

        target.stroke();
    }

    target.restore();


    // Fake person's movement
    const bob =
        Math.sin(
            time * 4 + index
        ) * size * 0.025;


    // Head
    target.globalAlpha = 1;
    target.fillStyle = clip.fg;

    target.beginPath();

    target.arc(
        0,
        -size * 0.12 + bob,
        size * 0.12,
        0,
        Math.PI * 2
    );

    target.fill();


    // Body
    target.beginPath();

    target.roundRect(
        -size * 0.17,
        size * 0.02 + bob,
        size * 0.34,
        size * 0.30,
        size * 0.05
    );

    target.fill();


    // Waving arm
    target.strokeStyle = clip.fg;
    target.lineWidth = size * 0.065;
    target.lineCap = "round";

    const handY =
        -size * 0.20 +
        Math.sin(
            time * 5 + index
        ) * size * 0.10;

    target.beginPath();

    target.moveTo(
        size * 0.08,
        size * 0.08 + bob
    );

    target.lineTo(
        size * 0.27,
        handY
    );

    target.stroke();


    // Label
    target.globalAlpha = 0.75;

    target.font =
        "bold " +
        Math.max(14, size * 0.08) +
        "px Arial";

    target.textAlign = "center";
    target.textBaseline = "middle";

    target.fillText(
        "CLIP " + clip.id,
        0,
        size * 0.40
    );

    target.restore();
}


// ==================================================
// CREATE THE 4/3 MASK
// ==================================================

function createMask() {

    const mask = document.createElement("canvas");

    mask.width = 1000;
    mask.height = 1000;

    const m = mask.getContext("2d");


    // Transparent background
    m.clearRect(0, 0, 1000, 1000);


    // White = visible area
    m.strokeStyle = "#ffffff";
    m.lineWidth = 145;
    m.lineCap = "square";
    m.lineJoin = "miter";


    // --------------------------
    // THE 4
    // --------------------------

    m.beginPath();

    m.moveTo(350, 120);
    m.lineTo(350, 530);
    m.lineTo(110, 530);
    m.lineTo(520, 120);
    m.lineTo(520, 880);

    m.stroke();


    // --------------------------
    // THE 3
    // --------------------------

    m.beginPath();

    m.moveTo(650, 170);

    m.bezierCurveTo(
        850, 80,
        890, 280,
        700, 470
    );

    m.bezierCurveTo(
        900, 500,
        900, 850,
        650, 830
    );

    m.stroke();


    return mask;
}

const mask = createMask();


// ==================================================
// CAMERA PATH
// ==================================================

const path = [
    { x: 0.18, y: 0.16 },
    { x: 0.36, y: 0.17 },
    { x: 0.29, y: 0.39 },
    { x: 0.51, y: 0.42 },
    { x: 0.51, y: 0.63 },
    { x: 0.75, y: 0.65 },
    { x: 0.78, y: 0.82 }
];


// ==================================================
// EASING
// ==================================================

function ease(t) {
    return t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;
}


// ==================================================
// CAMERA POSITION
// ==================================================

function getCamera(progress) {

    const scaled =
        progress * (path.length - 1);

    const segment =
        Math.min(
            Math.floor(scaled),
            path.length - 2
        );

    const local =
        scaled - segment;

    const a = path[segment];
    const b = path[segment + 1];

    return {
        x: a.x + (b.x - a.x) * local,
        y: a.y + (b.y - a.y) * local
    };
}


// ==================================================
// DRAW THE ACTUAL CLIP-FILLED 4/3
// ==================================================

function draw43(time, zoom, cameraX, cameraY) {

    const size =
        Math.min(W, H) * 1.25;

    const clipSize =
        size * 0.23;


    // ----------------------------------------------
    // Temporary layer
    // ----------------------------------------------

    const layer =
        document.createElement("canvas");

    layer.width = W * DPR;
    layer.height = H * DPR;

    const layerCtx =
        layer.getContext("2d");

    layerCtx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    // ----------------------------------------------
    // Draw lots of clips
    // ----------------------------------------------

    for (
        let row = -6;
        row <= 7;
        row++
    ) {

        for (
            let col = -6;
            col <= 7;
            col++
        ) {

            const index =
                Math.abs(
                    row * 7 + col
                ) % clips.length;


            const moveX =
                Math.sin(
                    time * 1.6 +
                    row * 1.7 +
                    col
                ) *
                clipSize *
                0.08;


            const moveY =
                Math.cos(
                    time * 1.4 +
                    col * 1.3 +
                    row
                ) *
                clipSize *
                0.08;


            const x =
                W / 2 +
                col * clipSize * 0.82 +
                moveX;


            const y =
                H / 2 +
                row * clipSize * 0.82 +
                moveY;


            // THIS IS THE IMPORTANT FIX:
            // draw the clip onto layerCtx,
            // not the main canvas.

            drawClip(
                layerCtx,
                x,
                y,
                clipSize,
                index,
                time
            );
        }
    }


    // ----------------------------------------------
    // Apply the 4/3 mask
    // ----------------------------------------------

    layerCtx.globalCompositeOperation =
        "destination-in";

    layerCtx.drawImage(
        mask,
        W / 2 - size / 2,
        H / 2 - size / 2,
        size,
        size
    );


    // ----------------------------------------------
    // Camera zoom
    // ----------------------------------------------

    ctx.save();

    ctx.translate(
        W / 2,
        H / 2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -cameraX,
        -cameraY
    );


    // Draw ONLY the masked 4/3 layer
    ctx.drawImage(
        layer,
        -W / 2,
        -H / 2,
        W,
        H
    );

    ctx.restore();
}


// ==================================================
// MAIN ANIMATION
// ==================================================

function animate(now) {

    // Before starting, remain completely black.
    if (!started) {

        ctx.setTransform(
            DPR,
            0,
            0,
            DPR,
            0,
            0
        );

        ctx.fillStyle = "#000000";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        requestAnimationFrame(animate);

        return;
    }


    const elapsed =
        now - startTime;


    const raw =
        Math.min(
            elapsed / DURATION,
            1
        );


    const progress =
        ease(raw);


    // ----------------------------------------------
    // Zoom from VERY inside the 4
    // ----------------------------------------------

    const zoom =
        START_ZOOM -
        (START_ZOOM - 1) * progress;


    // ----------------------------------------------
    // Camera travels through the 4/3
    // ----------------------------------------------

    const camera =
        getCamera(progress);

    const baseSize =
        Math.min(W, H);

    const cameraX =
        (camera.x - 0.5) * baseSize;

    const cameraY =
        (camera.y - 0.5) * baseSize;


    // ----------------------------------------------
    // Clear
    // ----------------------------------------------

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    ctx.fillStyle = "#000000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // ----------------------------------------------
    // Draw clip-filled 4/3
    // ----------------------------------------------

    draw43(
        elapsed / 1000,
        zoom,
        cameraX,
        cameraY
    );


    /*
        IMPORTANT:

        When raw reaches 1, NOTHING changes.

        The same clip-filled 4/3 remains.
        No white logo.
        No fade.
        No flash.
        No second logo.
    */


    requestAnimationFrame(animate);
}


// ==================================================
// CLICK TO START
// ==================================================

canvas.addEventListener(
    "pointerdown",
    function () {

        if (started) {
            return;
        }

        started = true;
        startTime = performance.now();

        requestAnimationFrame(animate);
    }
);


// ==================================================
// INITIAL BLACK SCREEN
// ==================================================

ctx.fillStyle = "#000000";

ctx.fillRect(
    0,
    0,
    W,
    H
);

requestAnimationFrame(animate);

</script>

</body>
</html>
