<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Intro</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ============================================================
// SETTINGS
// ============================================================

const INTRO_DURATION = 10000;

// Start VERY zoomed in
const START_ZOOM = 8.5;

// Placeholder clips
const clips = [
    { type: 0 },
    { type: 1 },
    { type: 2 },
    { type: 3 },
    { type: 4 },
    { type: 5 }
];


// ============================================================
// ORIGINAL 4/3 CAMERA PATH
// ============================================================

const path = [
    { x: 0.16, y: 0.18 },
    { x: 0.38, y: 0.18 },
    { x: 0.30, y: 0.43 },
    { x: 0.55, y: 0.48 },
    { x: 0.70, y: 0.62 },
    { x: 0.82, y: 0.78 }
];


// ============================================================
// ORIGINAL 4/3 MASK
// ============================================================

function createMask() {
    const mask = document.createElement("canvas");

    mask.width = 1000;
    mask.height = 1000;

    const m = mask.getContext("2d");

    // Transparent background
    m.clearRect(0, 0, 1000, 1000);

    m.fillStyle = "#fff";

    // --------------------
    // 4
    // --------------------

    m.beginPath();

    m.moveTo(350, 120);
    m.lineTo(350, 530);
    m.lineTo(110, 530);
    m.lineTo(520, 120);
    m.lineTo(520, 880);

    m.lineWidth = 145;
    m.lineCap = "square";
    m.lineJoin = "miter";

    m.strokeStyle = "#fff";
    m.stroke();


    // --------------------
    // 3
    // --------------------

    m.beginPath();

    m.moveTo(650, 170);

    m.bezierCurveTo(
        850, 80,
        890, 280,
        700, 470
    );

    m.bezierCurveTo(
        900, 500,
        900, 850,
        650, 830
    );

    m.lineWidth = 145;
    m.lineCap = "square";
    m.lineJoin = "miter";

    m.strokeStyle = "#fff";
    m.stroke();

    return mask;
}

const mask = createMask();


// ============================================================
// PLACEHOLDER CLIPS
// ============================================================

function drawClipOnContext(c, x, y, size, type, time) {

    c.save();

    c.translate(x, y);

    // Slight movement inside every clip
    const wave =
        Math.sin(time * 0.0025 + type * 1.7) * size * 0.08;

    c.translate(wave, 0);

    // Clip background
    const gradients = [
        ["#1d3557", "#457b9d"],
        ["#283618", "#606c38"],
        ["#3c096c", "#7b2cbf"],
        ["#9d0208", "#dc2f02"],
        ["#023e8a", "#00b4d8"],
        ["#5a189a", "#ff6d00"]
    ];

    const g = c.createLinearGradient(
        -size / 2,
        -size / 2,
        size / 2,
        size / 2
    );

    g.addColorStop(0, gradients[type][0]);
    g.addColorStop(1, gradients[type][1]);

    c.fillStyle = g;
    c.fillRect(
        -size / 2,
        -size / 2,
        size,
        size
    );


    // Fake person
    c.fillStyle = "#f1c27d";

    c.beginPath();
    c.arc(
        0,
        -size * 0.08,
        size * 0.13,
        0,
        Math.PI * 2
    );
    c.fill();


    // Body
    c.fillStyle = "#111";

    c.beginPath();
    c.roundRect(
        -size * 0.18,
        size * 0.05,
        size * 0.36,
        size * 0.35,
        size * 0.06
    );
    c.fill();


    // Waving arm
    c.strokeStyle = "#f1c27d";
    c.lineWidth = size * 0.07;
    c.lineCap = "round";

    c.beginPath();

    c.moveTo(
        size * 0.13,
        size * 0.12
    );

    const armWave =
        Math.sin(time * 0.006 + type) * size * 0.12;

    c.lineTo(
        size * 0.30,
        -size * 0.05 + armWave
    );

    c.stroke();


    // Hand
    c.beginPath();

    c.arc(
        size * 0.30,
        -size * 0.05 + armWave,
        size * 0.075,
        0,
        Math.PI * 2
    );

    c.fill();

    c.restore();
}


// ============================================================
// DRAW ALL CLIPS
// ============================================================

function drawClips(c, time) {

    const tileSize = 105;

    // Lots of tiles packed together
    const spacing = 92;

    for (let y = -120; y <= 1120; y += spacing) {

        for (let x = -120; x <= 1120; x += spacing) {

            // Constant movement
            const speedMultiplier =
                0.65 +
                (time / INTRO_DURATION) * 2.0;

            const movement =
                time * 0.055 * speedMultiplier;

            const offsetX =
                ((x + movement) % 1800 + 1800) % 1800 - 900;

            const offsetY =
                ((y + movement * 0.55) % 1500 + 1500) % 1500 - 500;

            const index =
                (Math.floor(x / spacing) +
                 Math.floor(y / spacing) +
                 Math.floor(time / 300)) %
                clips.length;

            const type =
                (index + clips.length) %
                clips.length;

            drawClipOnContext(
                c,
                offsetX,
                offsetY,
                tileSize,
                type,
                time
            );
        }
    }
}


// ============================================================
// EASING
// ============================================================

function easeInOut(t) {
    return t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;
}


// ============================================================
// CAMERA
// ============================================================

function getCamera(t) {

    const eased = easeInOut(t);

    const zoom =
        START_ZOOM +
        (1 - START_ZOOM) * eased;

    const position =
        eased * (path.length - 1);

    const index =
        Math.min(
            Math.floor(position),
            path.length - 2
        );

    const local =
        position - index;

    const a = path[index];
    const b = path[index + 1];

    const x =
        a.x +
        (b.x - a.x) * local;

    const y =
        a.y +
        (b.y - a.y) * local;

    return {
        x,
        y,
        zoom
    };
}


// ============================================================
// MAIN SCENE
// ============================================================

function drawScene(time) {

    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);


    // --------------------------------------------------------
    // Create temporary layer for clips
    // --------------------------------------------------------

    const temp = document.createElement("canvas");

    temp.width = 1000;
    temp.height = 1000;

    const tc = temp.getContext("2d");

    drawClips(tc, time);


    // --------------------------------------------------------
    // Apply original 4/3 mask
    // --------------------------------------------------------

    tc.globalCompositeOperation = "destination-in";

    tc.drawImage(
        mask,
        0,
        0
    );

    tc.globalCompositeOperation = "source-over";


    // --------------------------------------------------------
    // Camera
    // --------------------------------------------------------

    const progress =
        Math.min(time / INTRO_DURATION, 1);

    const camera =
        getCamera(progress);

    const logoSize =
        Math.max(W, H) * 1.35;


    ctx.save();

    // Center screen
    ctx.translate(
        W / 2,
        H / 2
    );

    // Camera zoom
    ctx.scale(
        camera.zoom,
        camera.zoom
    );


    // Move camera through the 4/3
    ctx.translate(
        -camera.x * logoSize + logoSize * 0.5,
        -camera.y * logoSize + logoSize * 0.5
    );


    // Draw clip-filled 4/3
    ctx.drawImage(
        temp,
        0,
        0,
        logoSize,
        logoSize
    );

    ctx.restore();


    requestAnimationFrame(drawScene);
}


// ============================================================
// CLICK TO START
// ============================================================

let started = false;

function start() {

    if (started) return;

    started = true;

    const startTime = performance.now();

    function animate(now) {

        const elapsed =
            now - startTime;

        drawScene(elapsed);

        if (elapsed < INTRO_DURATION) {
            requestAnimationFrame(animate);
        } else {
            // Keep the final clip-filled 4/3 on screen
            drawScene(INTRO_DURATION);
        }
    }

    requestAnimationFrame(animate);
}


// Invisible click-to-start
document.addEventListener("click", start);

</script>

</body>
</html>
