<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>4/3 Graduation Intro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

// =========================================================
// SETTINGS
// =========================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


// Your six clips
const VIDEO_URLS = [
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
];

const videos = [];


// Zoom duration
const INTRO_DURATION = 6000;


// How often the clips change positions
const SWAP_INTERVAL = 800;


// =========================================================
// CANVAS
// =========================================================

function resizeCanvas() {

  const dpr = window.devicePixelRatio || 1;

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


// =========================================================
// OFFSCREEN CANVAS
// =========================================================

// Created ONCE.
// Not every frame.

const offscreen = document.createElement("canvas");
const offCtx = offscreen.getContext("2d");


// =========================================================
// CREATE VIDEOS
// =========================================================

VIDEO_URLS.forEach((url, index) => {

  const video = document.createElement("video");

  video.src = url;

  video.muted = true;
  video.loop = true;
  video.autoplay = false;
  video.playsInline = true;
  video.crossOrigin = "anonymous";

  video.addEventListener("loadeddata", () => {

    video.currentTime = index * 0.3;

  });

  videos.push(video);
});


// =========================================================
// START VIDEOS
// =========================================================

async function startVideos() {

  for (const video of videos) {

    try {
      await video.play();
    } catch (error) {
      console.log("Video waiting for permission...");
    }

  }
}


// =========================================================
// DRAW VIDEO WITH COVER CROP
// =========================================================

function drawVideoCover(
  video,
  x,
  y,
  width,
  height
) {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }


  const videoRatio =
    video.videoWidth / video.videoHeight;

  const boxRatio =
    width / height;


  let sourceWidth;
  let sourceHeight;
  let sourceX;
  let sourceY;


  if (videoRatio > boxRatio) {

    sourceHeight = video.videoHeight;

    sourceWidth =
      sourceHeight * boxRatio;

    sourceX =
      (video.videoWidth - sourceWidth) / 2;

    sourceY = 0;

  } else {

    sourceWidth = video.videoWidth;

    sourceHeight =
      sourceWidth / boxRatio;

    sourceX = 0;

    sourceY =
      (video.videoHeight - sourceHeight) / 2;
  }


  offCtx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceWidth,
    sourceHeight,

    x,
    y,
    width,
    height
  );
}


// =========================================================
// CLIP ORDER
// =========================================================

// Starts as:
//
// 1 2 3
// 4 5 6
//
// Then:
//
// 2 3 4
// 5 6 1
//
// Then:
//
// 3 4 5
// 6 1 2
//
// etc.

let clipOffset = 0;
let lastSwap = 0;


function updateClipOrder(time) {

  if (
    time - lastSwap >= SWAP_INTERVAL
  ) {

    clipOffset =
      (clipOffset + 1) % videos.length;

    lastSwap = time;
  }
}


// =========================================================
// DRAW THE 4/3
// =========================================================

function drawMaskedVideos(width, height) {

  offCtx.clearRect(
    0,
    0,
    width,
    height
  );


  // Six video tiles

  const tileWidth =
    width / 3;

  const tileHeight =
    height / 2;


  for (let i = 0; i < 6; i++) {

    const column =
      i % 3;

    const row =
      Math.floor(i / 3);


    const x =
      column * tileWidth;

    const y =
      row * tileHeight;


    // Rotate which clip occupies each tile
    const videoIndex =
      (i + clipOffset) % videos.length;


    drawVideoCover(
      videos[videoIndex],
      x,
      y,
      tileWidth,
      tileHeight
    );
  }


  // =======================================================
  // ORIGINAL 4/3 MASK
  // =======================================================

  offCtx.save();

  offCtx.globalCompositeOperation =
    "destination-in";


  offCtx.font =
    `900 ${height * 0.75}px Arial Black, Arial, sans-serif`;

  offCtx.textAlign =
    "center";

  offCtx.textBaseline =
    "middle";

  offCtx.fillStyle =
    "#fff";


  offCtx.fillText(
    "4/3",
    width / 2,
    height / 2
  );


  offCtx.restore();
}


// =========================================================
// INTRO
// =========================================================

let started = false;
let startTime = 0;


function render(time) {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  // Black background

  ctx.clearRect(
    0,
    0,
    screenWidth,
    screenHeight
  );

  ctx.fillStyle = "#000";

  ctx.fillRect(
    0,
    0,
    screenWidth,
    screenHeight
  );


  if (!started) {

    requestAnimationFrame(render);

    return;
  }


  // =======================================================
  // PROGRESS
  // =======================================================

  const elapsed =
    time - startTime;


  const progress =
    Math.min(
      elapsed / INTRO_DURATION,
      1
    );


  // Smooth zoom out

  const eased =
    1 - Math.pow(1 - progress, 3);


  const startScale = 3.8;
  const endScale = 1;


  const scale =
    startScale +
    (endScale - startScale) * eased;


  // =======================================================
  // LOGO SIZE
  // =======================================================

  const logoWidth =
    Math.min(
      screenWidth * 0.75,
      1000
    );


  const logoHeight =
    Math.min(
      screenHeight * 0.75,
      700
    );


  // Make sure offscreen canvas is the right size

  if (
    offscreen.width !== Math.floor(logoWidth) ||
    offscreen.height !== Math.floor(logoHeight)
  ) {

    offscreen.width =
      Math.floor(logoWidth);

    offscreen.height =
      Math.floor(logoHeight);
  }


  // =======================================================
  // UPDATE CLIP POSITIONS
  // =======================================================

  updateClipOrder(time);


  // =======================================================
  // BUILD 4/3
  // =======================================================

  drawMaskedVideos(
    logoWidth,
    logoHeight
  );


  // =======================================================
  // DRAW ZOOMED 4/3
  // =======================================================

  const drawWidth =
    logoWidth * scale;

  const drawHeight =
    logoHeight * scale;


  const x =
    screenWidth / 2 -
    drawWidth / 2;

  const y =
    screenHeight / 2 -
    drawHeight / 2;


  ctx.drawImage(
    offscreen,
    x,
    y,
    drawWidth,
    drawHeight
  );


  requestAnimationFrame(render);
}


// =========================================================
// CLICK ANYWHERE TO START
// =========================================================

document.addEventListener(
  "click",
  async () => {

    if (started) return;

    started = true;

    startTime =
      performance.now();

    await startVideos();

    requestAnimationFrame(render);
  }
);


// =========================================================
// START RENDER LOOP
// =========================================================

requestAnimationFrame(render);

</script>

</body>
</html>
