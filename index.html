<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Intro</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


// ============================================================
// 6 PLACEHOLDER CLIPS
// ============================================================

const clips = [
    "#457b9d",
    "#606c38",
    "#7b2cbf",
    "#dc2f02",
    "#00b4d8",
    "#ff6d00"
];


// ============================================================
// DRAW A PLACEHOLDER CLIP
// ============================================================

function drawClip(x, y, size, colour, number) {

    // Clip background
    ctx.fillStyle = colour;

    ctx.fillRect(
        x,
        y,
        size,
        size
    );


    // Person
    ctx.fillStyle = "#f1c27d";

    ctx.beginPath();

    ctx.arc(
        x + size * 0.5,
        y + size * 0.35,
        size * 0.12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Body
    ctx.fillStyle = "#111";

    ctx.fillRect(
        x + size * 0.34,
        y + size * 0.48,
        size * 0.32,
        size * 0.38
    );


    // Waving arm
    ctx.strokeStyle = "#f1c27d";
    ctx.lineWidth = size * 0.07;
    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(
        x + size * 0.63,
        y + size * 0.52
    );

    ctx.lineTo(
        x + size * 0.82,
        y + size * 0.30
    );

    ctx.stroke();


    // Number
    ctx.fillStyle = "white";
    ctx.font = `bold ${size * 0.12}px Arial`;
    ctx.textAlign = "center";

    ctx.fillText(
        number,
        x + size * 0.5,
        y + size * 0.93
    );
}


// ============================================================
// 4/3 MASK
// ============================================================

function createMask() {

    const mask = document.createElement("canvas");

    mask.width = 1000;
    mask.height = 1000;

    const m = mask.getContext("2d");

    m.clearRect(0, 0, 1000, 1000);

    m.strokeStyle = "white";
    m.lineWidth = 145;
    m.lineCap = "square";
    m.lineJoin = "miter";


    // -------------------------
    // 4
    // -------------------------

    m.beginPath();

    m.moveTo(350, 120);
    m.lineTo(350, 530);
    m.lineTo(110, 530);
    m.lineTo(520, 120);
    m.lineTo(520, 880);

    m.stroke();


    // -------------------------
    // 3
    // -------------------------

    m.beginPath();

    m.moveTo(650, 170);

    m.bezierCurveTo(
        850, 80,
        890, 280,
        700, 470
    );

    m.bezierCurveTo(
        900, 500,
        900, 850,
        650, 830
    );

    m.stroke();


    return mask;
}

const mask = createMask();


// ============================================================
// DRAW THE 6 CLIPS
// ============================================================

function drawClips() {

    const size = 150;

    const positions = [
        [170, 150],
        [350, 150],
        [530, 150],
        [260, 400],
        [440, 400],
        [620, 400]
    ];


    positions.forEach((pos, i) => {

        drawClip(
            pos[0],
            pos[1],
            size,
            clips[i],
            i + 1
        );

    });
}


// ============================================================
// CREATE CLIP LAYER
// ============================================================

const clipCanvas = document.createElement("canvas");

clipCanvas.width = 1000;
clipCanvas.height = 1000;

const clipCtx = clipCanvas.getContext("2d");


// Temporarily use the clip canvas
function renderClips() {

    clipCtx.clearRect(
        0,
        0,
        1000,
        1000
    );

    const originalContext = window.ctx;

    // Draw using the clip canvas context
    function drawClipToLayer(x, y, size, colour, number) {

        clipCtx.fillStyle = colour;

        clipCtx.fillRect(
            x,
            y,
            size,
            size
        );

        clipCtx.fillStyle = "#f1c27d";

        clipCtx.beginPath();

        clipCtx.arc(
            x + size * 0.5,
            y + size * 0.35,
            size * 0.12,
            0,
            Math.PI * 2
        );

        clipCtx.fill();

        clipCtx.fillStyle = "#111";

        clipCtx.fillRect(
            x + size * 0.34,
            y + size * 0.48,
            size * 0.32,
            size * 0.38
        );

        clipCtx.strokeStyle = "#f1c27d";
        clipCtx.lineWidth = size * 0.07;
        clipCtx.lineCap = "round";

        clipCtx.beginPath();

        clipCtx.moveTo(
            x + size * 0.63,
            y + size * 0.52
        );

        clipCtx.lineTo(
            x + size * 0.82,
            y + size * 0.30
        );

        clipCtx.stroke();

        clipCtx.fillStyle = "white";
        clipCtx.font = `bold ${size * 0.12}px Arial`;
        clipCtx.textAlign = "center";

        clipCtx.fillText(
            number,
            x + size * 0.5,
            y + size * 0.93
        );
    }


    const size = 150;

    const positions = [
        [170, 150],
        [350, 150],
        [530, 150],
        [260, 400],
        [440, 400],
        [620, 400]
    ];


    positions.forEach((pos, i) => {

        drawClipToLayer(
            pos[0],
            pos[1],
            size,
            clips[i],
            i + 1
        );

    });


    // Cut everything outside the 4/3
    clipCtx.globalCompositeOperation = "destination-in";

    clipCtx.drawImage(
        mask,
        0,
        0
    );

    clipCtx.globalCompositeOperation = "source-over";
}


// ============================================================
// DRAW FINAL RESULT
// ============================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    renderClips();


    const size =
        Math.max(W, H) * 1.1;


    ctx.drawImage(
        clipCanvas,
        (W - size) / 2,
        (H - size) / 2,
        size,
        size
    );
}


draw();

</script>

</body>
</html>
