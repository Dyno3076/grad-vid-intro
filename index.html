<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>4/3 Graduation Intro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: contain;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
      color: white;

      font-family: Arial, sans-serif;
      font-size: 20px;
      letter-spacing: 2px;

      cursor: pointer;
    }

    #start.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div id="start">
    CLICK TO START
  </div>

  <canvas id="canvas"></canvas>

  <script>
    // =========================================================
    // SETTINGS
    // =========================================================

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("start");

    // Placeholder video.
    // Later, replace these with:
    //
    // "videos/clip1.mp4"
    // "videos/clip2.mp4"
    // etc.
    //
    const VIDEO_URLS = [
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
    ];

    const videos = [];

    // Animation length
    const INTRO_DURATION = 6000;

    // =========================================================
    // CANVAS
    // =========================================================

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;

      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);


    // =========================================================
    // CREATE VIDEOS
    // =========================================================

    function createVideos() {

      VIDEO_URLS.forEach((url, index) => {

        const video = document.createElement("video");

        video.src = url;

        video.muted = true;
        video.loop = true;
        video.autoplay = false;
        video.playsInline = true;
        video.crossOrigin = "anonymous";

        video.addEventListener("loadeddata", () => {

          // Start at slightly different points
          // so the clips don't look identical.
          video.currentTime = index * 0.3;

        });

        videos.push(video);
      });
    }

    createVideos();


    // =========================================================
    // WAIT UNTIL VIDEOS ARE READY
    // =========================================================

    async function startVideos() {

      for (const video of videos) {

        try {
          await video.play();
        } catch (error) {
          console.log("Video waiting for permission...");
        }

      }
    }


    // =========================================================
    // DRAW A VIDEO TILE
    // =========================================================

    function drawVideoCover(video, x, y, width, height) {

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {
        return;
      }

      const videoRatio =
        video.videoWidth / video.videoHeight;

      const boxRatio =
        width / height;

      let sourceWidth;
      let sourceHeight;
      let sourceX;
      let sourceY;

      if (videoRatio > boxRatio) {

        sourceHeight = video.videoHeight;

        sourceWidth =
          sourceHeight * boxRatio;

        sourceX =
          (video.videoWidth - sourceWidth) / 2;

        sourceY = 0;

      } else {

        sourceWidth = video.videoWidth;

        sourceHeight =
          sourceWidth / boxRatio;

        sourceX = 0;

        sourceY =
          (video.videoHeight - sourceHeight) / 2;
      }

      ctx.drawImage(
        video,

        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,

        x,
        y,
        width,
        height
      );
    }


    // =========================================================
    // CREATE THE 4/3 MASK
    // =========================================================

    function drawMaskedVideos(width, height) {

      /*
        First draw the six videos onto the canvas.

        Then use "destination-in" to keep ONLY
        the areas where the text 4/3 exists.
      */

      const tileWidth = width / 3;
      const tileHeight = height / 2;

      // Six video tiles
      for (let i = 0; i < 6; i++) {

        const column = i % 3;
        const row = Math.floor(i / 3);

        const x = column * tileWidth;
        const y = row * tileHeight;

        drawVideoCover(
          videos[i],
          x,
          y,
          tileWidth,
          tileHeight
        );
      }

      // Save the video layer
      ctx.save();

      // Everything after this is clipped to the text
      ctx.globalCompositeOperation = "destination-in";

      ctx.font =
        `900 ${height * 0.75}px Arial Black, Arial, sans-serif`;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#fff";

      ctx.fillText(
        "4/3",
        width / 2,
        height / 2
      );

      ctx.restore();
    }


    // =========================================================
    // DRAW THE INTRO
    // =========================================================

    function render(time) {

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      ctx.clearRect(
        0,
        0,
        screenWidth,
        screenHeight
      );

      // Black background
      ctx.fillStyle = "#000";

      ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
      );


      // -------------------------------------------------------
      // ANIMATION PROGRESS
      // -------------------------------------------------------

      const progress =
        Math.min(time / INTRO_DURATION, 1);


      /*
        We want:

        START:
        Extremely zoomed in.

        END:
        Full 4/3 visible.
      */

      const startScale = 3.8;
      const endScale = 1;

      // Smooth ease-out
      const eased =
        1 - Math.pow(1 - progress, 3);

      const scale =
        startScale +
        (endScale - startScale) * eased;


      // -------------------------------------------------------
      // SIZE OF THE 4/3
      // -------------------------------------------------------

      const logoWidth =
        Math.min(
          screenWidth * 0.75,
          1000
        );

      const logoHeight =
        Math.min(
          screenHeight * 0.75,
          700
        );


      // -------------------------------------------------------
      // DRAW INTO AN OFFSCREEN CANVAS
      // -------------------------------------------------------

      const offscreen =
        document.createElement("canvas");

      offscreen.width = logoWidth;
      offscreen.height = logoHeight;

      const offCtx =
        offscreen.getContext("2d");


      // Temporarily switch context
      const oldCanvas = canvas;

      // Draw the videos directly using our main context
      // after transforming it.

      ctx.save();

      ctx.translate(
        screenWidth / 2,
        screenHeight / 2
      );

      ctx.scale(
        scale,
        scale
      );

      ctx.translate(
        -logoWidth / 2,
        -logoHeight / 2
      );

      // Create a transparent layer
      ctx.save();

      ctx.globalCompositeOperation =
        "source-over";

      drawMaskedVideos(
        logoWidth,
        logoHeight
      );

      ctx.restore();

      ctx.restore();


      // -------------------------------------------------------
      // FINAL 4/3 FLASH
      // -------------------------------------------------------

      if (progress > 0.88) {

        const flashProgress =
          (progress - 0.88) / 0.12;

        const alpha =
          Math.sin(
            flashProgress * Math.PI
          );

        ctx.fillStyle =
          `rgba(255,255,255,${alpha * 0.25})`;

        ctx.fillRect(
          0,
          0,
          screenWidth,
          screenHeight
        );
      }


      // -------------------------------------------------------
      // END
      // -------------------------------------------------------

      if (progress >= 1) {

        // Keep the final 4/3 on screen.
        ctx.save();

        ctx.fillStyle = "#fff";

        ctx.font =
          `900 ${Math.min(screenWidth, screenHeight) * 0.32}px Arial Black, Arial, sans-serif`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
          "4/3",
          screenWidth / 2,
          screenHeight / 2
        );

        ctx.restore();
      }

      requestAnimationFrame(render);
    }


    // =========================================================
    // START
    // =========================================================

    startScreen.addEventListener("click", async () => {

      startScreen.classList.add("hidden");

      await startVideos();

      requestAnimationFrame(render);
    });

  </script>

</body>
</html>
