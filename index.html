<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4/3 Graduation Intro</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        width: 100vw;
        height: 100vh;
        display: block;
    }

    #start {
        position: fixed;
        inset: 0;
        z-index: 20;

        display: flex;
        align-items: center;
        justify-content: center;

        background: black;
        color: white;

        font-family: Arial, sans-serif;
        font-size: 20px;
        letter-spacing: 3px;

        cursor: pointer;
    }

    #start.hidden {
        display: none;
    }
</style>
</head>

<body>

<div id="start">CLICK TO START</div>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("start");

/*
    PUT YOUR SIX VIDEOS HERE LATER.

    For now, all six use the same placeholder.
*/
const VIDEO_URLS = [
    "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
];

/*
    TOTAL ZOOM-OUT TIME

    10 seconds, as requested.
*/
const INTRO_DURATION = 10000;


/* =========================================================
   CANVAS SETUP
========================================================= */

function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   VIDEOS
========================================================= */

const videos = [];

VIDEO_URLS.forEach((url, index) => {

    const video = document.createElement("video");

    video.src = url;

    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.autoplay = false;
    video.crossOrigin = "anonymous";

    video.addEventListener("loadeddata", () => {

        video.currentTime = index * 0.2;

    });

    videos.push(video);
});


async function startVideos() {

    for (const video of videos) {

        try {
            await video.play();
        }

        catch (error) {
            console.log("Video waiting for permission");
        }
    }
}


/* =========================================================
   EASING
========================================================= */

function easeOutCubic(t) {

    return 1 - Math.pow(1 - t, 3);

}


/*
    This one starts relatively calm,
    then becomes increasingly aggressive.
*/
function accelerate(t) {

    return Math.pow(t, 2.7);

}


/* =========================================================
   DRAW VIDEO
========================================================= */

function drawVideoCover(video, x, y, width, height) {

    if (!video.videoWidth || !video.videoHeight) {
        return;
    }

    const videoRatio =
        video.videoWidth / video.videoHeight;

    const boxRatio =
        width / height;

    let sourceWidth;
    let sourceHeight;
    let sourceX;
    let sourceY;

    if (videoRatio > boxRatio) {

        sourceHeight = video.videoHeight;

        sourceWidth =
            sourceHeight * boxRatio;

        sourceX =
            (video.videoWidth - sourceWidth) / 2;

        sourceY = 0;

    } else {

        sourceWidth = video.videoWidth;

        sourceHeight =
            sourceWidth / boxRatio;

        sourceX = 0;

        sourceY =
            (video.videoHeight - sourceHeight) / 2;
    }

    ctx.drawImage(
        video,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        x,
        y,
        width,
        height
    );
}


/* =========================================================
   4/3 MASK
========================================================= */

function createMask(width, height) {

    /*
        IMPORTANT:

        This creates ONLY the mask.

        It does NOT draw a second visible 4/3.
    */

    ctx.font =
        `900 ${height * 0.78}px Arial Black, Arial, sans-serif`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "white";

    ctx.fillText(
        "4/3",
        width / 2,
        height / 2
    );
}


/* =========================================================
   MOVING CLIPS
========================================================= */

/*
    These are positions inside the 4/3.

    The "camera" travels through them.

    Think:

       START
         ↓
      ┌─────┐
      │  1  │
      │     │
      │  2 → 3
      │     │
      │  4  │
      │     ↓
      │ 5 → 6
      └─────┘

    We can change these later once we see the actual effect.
*/

const clipPath = [

    { x: 0.18, y: 0.20 },

    { x: 0.38, y: 0.22 },

    { x: 0.68, y: 0.28 },

    { x: 0.30, y: 0.55 },

    { x: 0.62, y: 0.66 },

    { x: 0.82, y: 0.80 }

];


/* =========================================================
   DRAW MOVING CLIP
========================================================= */

function drawMovingClip(
    video,
    centerX,
    centerY,
    clipWidth,
    clipHeight,
    rotation
) {

    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );

    ctx.rotate(rotation);

    drawVideoCover(
        video,
        -clipWidth / 2,
        -clipHeight / 2,
        clipWidth,
        clipHeight
    );

    ctx.restore();
}


/* =========================================================
   MAIN ANIMATION
========================================================= */

let animationStart = null;

function render(timestamp) {

    if (!animationStart) {
        animationStart = timestamp;
    }

    const elapsed =
        timestamp - animationStart;

    const rawProgress =
        Math.min(
            elapsed / INTRO_DURATION,
            1
        );


    /* -------------------------------------------------------
       BACKGROUND
    ------------------------------------------------------- */

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    ctx.clearRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );


    /* -------------------------------------------------------
       4/3 SIZE
    ------------------------------------------------------- */

    const baseWidth =
        Math.min(
            screenWidth * 0.65,
            900
        );

    const baseHeight =
        Math.min(
            screenHeight * 0.65,
            700
        );


    /* -------------------------------------------------------
       ZOOM

       Starts VERY close.

       Ends at normal size after 10 seconds.
    ------------------------------------------------------- */

    const zoomProgress =
        easeOutCubic(rawProgress);

    const startZoom = 4.5;
    const endZoom = 1;

    const zoom =
        startZoom +
        (endZoom - startZoom)
        * zoomProgress;


    /* -------------------------------------------------------
       ACCELERATION

       This controls how quickly the clips
       change as we approach the reveal.
    ------------------------------------------------------- */

    const speed =
        accelerate(rawProgress);


    /*
        Number of clip changes.

        Starts slowly.

        Ends extremely fast.
    */

    const clipCycles =
        Math.floor(
            speed * 28
        );


    /* -------------------------------------------------------
       CURRENT CLIP
    ------------------------------------------------------- */

    const clipIndex =
        clipCycles % videos.length;

    const currentVideo =
        videos[clipIndex];


    /* -------------------------------------------------------
       MOVEMENT THROUGH THE 4/3
    ------------------------------------------------------- */

    const pathPosition =
        speed * (clipPath.length - 1);

    const pathIndex =
        Math.min(
            Math.floor(pathPosition),
            clipPath.length - 2
        );

    const pathProgress =
        pathPosition - pathIndex;

    const pointA =
        clipPath[pathIndex];

    const pointB =
        clipPath[pathIndex + 1];


    const pathX =
        pointA.x +
        (pointB.x - pointA.x)
        * pathProgress;

    const pathY =
        pointA.y +
        (pointB.y - pointA.y)
        * pathProgress;


    /* -------------------------------------------------------
       TRANSFORM
    ------------------------------------------------------- */

    ctx.save();

    ctx.translate(
        screenWidth / 2,
        screenHeight / 2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -baseWidth / 2,
        -baseHeight / 2
    );


    /* -------------------------------------------------------
       CREATE VIDEO LAYER
    ------------------------------------------------------- */

    ctx.save();

    /*
        Everything drawn here will eventually
        be clipped to the 4/3.
    */

    const clipWidth =
        baseWidth * 0.48;

    const clipHeight =
        baseHeight * 0.65;


    /*
        Slight movement even while switching clips.
        Makes the whole thing feel alive.
    */

    const wobbleX =
        Math.sin(elapsed / 170) *
        baseWidth *
        0.025;

    const wobbleY =
        Math.cos(elapsed / 210) *
        baseHeight *
        0.025;


    drawMovingClip(
        currentVideo,

        pathX * baseWidth
            + wobbleX,

        pathY * baseHeight
            + wobbleY,

        clipWidth,

        clipHeight,

        Math.sin(elapsed / 300) * 0.025
    );


    /*
        Add another clip slightly behind it.

        This creates overlapping movement
        when things start speeding up.
    */

    if (rawProgress > 0.25) {

        const previousIndex =
            (clipIndex - 1 + videos.length)
            % videos.length;

        const previousVideo =
            videos[previousIndex];

        const offset =
            Math.sin(elapsed / 90) *
            baseWidth *
            0.08;

        drawMovingClip(
            previousVideo,

            pathX * baseWidth
                + offset,

            pathY * baseHeight,

            clipWidth,

            clipHeight,

            -Math.sin(elapsed / 250) * 0.03
        );
    }


    /* -------------------------------------------------------
       CLIP TO 4/3
    ------------------------------------------------------- */

    ctx.globalCompositeOperation =
        "destination-in";

    createMask(
        baseWidth,
        baseHeight
    );

    ctx.restore();


    /* -------------------------------------------------------
       RESTORE
    ------------------------------------------------------- */

    ctx.restore();


    /* -------------------------------------------------------
       FINAL WHITE 4/3 REVEAL
    ------------------------------------------------------- */

    /*
        The white logo ONLY appears right at the end.

        This fixes the problem where a smaller white
        4/3 was sitting on top of the clips.
    */

    if (rawProgress > 0.88) {

        const revealProgress =
            (rawProgress - 0.88) / 0.12;

        const whiteOpacity =
            Math.pow(
                revealProgress,
                2
            );

        ctx.save();

        ctx.globalAlpha =
            whiteOpacity;

        ctx.font =
            `900 ${Math.min(screenWidth, screenHeight) * 0.32}px Arial Black, Arial, sans-serif`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "white";

        ctx.fillText(
            "4/3",
            screenWidth / 2,
            screenHeight / 2
        );

        ctx.restore();
    }


    /* -------------------------------------------------------
       FINISH
    ------------------------------------------------------- */

    if (rawProgress < 1) {

        requestAnimationFrame(render);

    } else {

        /*
            Keep clean white 4/3 on screen.
        */

        ctx.clearRect(
            0,
            0,
            screenWidth,
            screenHeight
        );

        ctx.fillStyle = "black";

        ctx.fillRect(
            0,
            0,
            screenWidth,
            screenHeight
        );

        ctx.font =
            `900 ${Math.min(screenWidth, screenHeight) * 0.32}px Arial Black, Arial, sans-serif`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "white";

        ctx.fillText(
            "4/3",
            screenWidth / 2,
            screenHeight / 2
        );

    }
}


/* =========================================================
   START BUTTON
========================================================= */

startScreen.addEventListener("click", async () => {

    startScreen.classList.add("hidden");

    await startVideos();

    animationStart = null;

    requestAnimationFrame(render);

});

</script>

</body>
</html>
