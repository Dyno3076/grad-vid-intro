<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Intro</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


// ============================================================
// SETTINGS
// ============================================================

const INTRO_DURATION = 10000;
const START_ZOOM = 8.5;


// ============================================================
// ORIGINAL 4/3 CAMERA PATH
// ============================================================

const path = [
    { x: 0.16, y: 0.18 },
    { x: 0.38, y: 0.18 },
    { x: 0.30, y: 0.43 },
    { x: 0.55, y: 0.48 },
    { x: 0.70, y: 0.62 },
    { x: 0.82, y: 0.78 }
];


// ============================================================
// ORIGINAL 4/3 MASK
// ============================================================

function createMask() {

    const mask = document.createElement("canvas");

    mask.width = 1000;
    mask.height = 1000;

    const m = mask.getContext("2d");

    m.clearRect(0, 0, 1000, 1000);

    m.strokeStyle = "white";
    m.lineWidth = 145;
    m.lineCap = "square";
    m.lineJoin = "miter";

    // 4
    m.beginPath();
    m.moveTo(350, 120);
    m.lineTo(350, 530);
    m.lineTo(110, 530);
    m.lineTo(520, 120);
    m.lineTo(520, 880);
    m.stroke();

    // 3
    m.beginPath();
    m.moveTo(650, 170);

    m.bezierCurveTo(
        850, 80,
        890, 280,
        700, 470
    );

    m.bezierCurveTo(
        900, 500,
        900, 850,
        650, 830
    );

    m.stroke();

    return mask;
}

const mask = createMask();


// ============================================================
// PLACEHOLDER CLIPS
// ============================================================

function drawClip(c, x, y, size, type, time) {

    c.save();

    c.translate(x, y);

    const wave =
        Math.sin(time * 0.0025 + type * 1.7)
        * size * 0.08;

    c.translate(wave, 0);


    const gradients = [
        ["#1d3557", "#457b9d"],
        ["#283618", "#606c38"],
        ["#3c096c", "#7b2cbf"],
        ["#9d0208", "#dc2f02"],
        ["#023e8a", "#00b4d8"],
        ["#5a189a", "#ff6d00"]
    ];

    const g = c.createLinearGradient(
        -size / 2,
        -size / 2,
        size / 2,
        size / 2
    );

    g.addColorStop(0, gradients[type][0]);
    g.addColorStop(1, gradients[type][1]);

    c.fillStyle = g;

    c.fillRect(
        -size / 2,
        -size / 2,
        size,
        size
    );


    // Head
    c.fillStyle = "#f1c27d";

    c.beginPath();

    c.arc(
        0,
        -size * 0.08,
        size * 0.13,
        0,
        Math.PI * 2
    );

    c.fill();


    // Body
    c.fillStyle = "#111";

    c.beginPath();

    c.roundRect(
        -size * 0.18,
        size * 0.05,
        size * 0.36,
        size * 0.35,
        size * 0.06
    );

    c.fill();


    // Waving arm
    c.strokeStyle = "#f1c27d";
    c.lineWidth = size * 0.07;
    c.lineCap = "round";

    const armWave =
        Math.sin(time * 0.006 + type)
        * size * 0.12;

    c.beginPath();

    c.moveTo(
        size * 0.13,
        size * 0.12
    );

    c.lineTo(
        size * 0.30,
        -size * 0.05 + armWave
    );

    c.stroke();


    // Hand
    c.beginPath();

    c.arc(
        size * 0.30,
        -size * 0.05 + armWave,
        size * 0.075,
        0,
        Math.PI * 2
    );

    c.fill();

    c.restore();
}


// ============================================================
// DRAW CLIPS
// ============================================================

function drawClips(c, time) {

    const tileSize = 105;
    const spacing = 92;

    const speed =
        0.55 +
        (time / INTRO_DURATION) * 2.2;

    const movement =
        time * 0.055 * speed;


    for (let y = -200; y <= 1200; y += spacing) {

        for (let x = -200; x <= 1200; x += spacing) {

            const offsetX =
                ((x + movement) % 1800 + 1800) % 1800 - 900;

            const offsetY =
                ((y + movement * 0.55) % 1500 + 1500) % 1500 - 500;


            const gridX = Math.floor(x / spacing);
            const gridY = Math.floor(y / spacing);

            const index =
                Math.abs(
                    gridX * 7 +
                    gridY * 13 +
                    Math.floor(time / 300)
                ) % 6;


            drawClip(
                c,
                offsetX,
                offsetY,
                tileSize,
                index,
                time
            );
        }
    }
}


// ============================================================
// EASING
// ============================================================

function easeInOut(t) {

    return t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;
}


// ============================================================
// CAMERA
// ============================================================

function getCamera(progress) {

    const eased = easeInOut(progress);

    const zoom =
        START_ZOOM +
        (1 - START_ZOOM) * eased;


    const position =
        eased * (path.length - 1);

    const index =
        Math.min(
            Math.floor(position),
            path.length - 2
        );

    const local =
        position - index;


    const a = path[index];
    const b = path[index + 1];


    return {
        x: a.x + (b.x - a.x) * local,
        y: a.y + (b.y - a.y) * local,
        zoom: zoom
    };
}


// ============================================================
// DRAW FRAME
// ============================================================

function drawFrame(elapsed) {

    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, W, H);


    const temp = document.createElement("canvas");

    temp.width = 1000;
    temp.height = 1000;

    const tc = temp.getContext("2d");


    drawClips(tc, elapsed);


    tc.globalCompositeOperation = "destination-in";

    tc.drawImage(
        mask,
        0,
        0
    );

    tc.globalCompositeOperation = "source-over";


    const progress =
        Math.min(
            elapsed / INTRO_DURATION,
            1
        );

    const camera =
        getCamera(progress);


    const logoSize =
        Math.max(W, H) * 1.35;


    ctx.save();

    ctx.translate(
        W / 2,
        H / 2
    );


    ctx.scale(
        camera.zoom,
        camera.zoom
    );


    ctx.translate(
        -camera.x * logoSize,
        -camera.y * logoSize
    );


    ctx.drawImage(
        temp,
        0,
        0,
        logoSize,
        logoSize
    );


    ctx.restore();
}


// ============================================================
// CLICK TO START
// ============================================================

let started = false;

document.addEventListener("click", function() {

    if (started) return;

    started = true;

    const startTime = performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;


        drawFrame(elapsed);


        if (elapsed < INTRO_DURATION) {

            requestAnimationFrame(animate);

        } else {

            drawFrame(INTRO_DURATION);
        }
    }


    requestAnimationFrame(animate);
});

</script>

</body>
</html>
