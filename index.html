<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4/3 Graduation Intro</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    width: 100vw;
    height: 100vh;
    display: block;
}

#start {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    color: #fff;

    font-family: Arial, sans-serif;
    font-size: 20px;
    letter-spacing: 3px;

    cursor: pointer;
}

#start.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="start">CLICK TO START</div>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("start");

const INTRO_DURATION = 10000;


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   SIX DIFFERENT PLACEHOLDER "CLIPS"
   
   These are intentionally different so you can clearly
   see which clip is travelling through the 4/3.
========================================================= */

const clips = [
    {
        name: "CLIP 1",
        type: 0
    },
    {
        name: "CLIP 2",
        type: 1
    },
    {
        name: "CLIP 3",
        type: 2
    },
    {
        name: "CLIP 4",
        type: 3
    },
    {
        name: "CLIP 5",
        type: 4
    },
    {
        name: "CLIP 6",
        type: 5
    }
];


/* =========================================================
   DRAW PLACEHOLDER CLIP
========================================================= */

function drawClip(clip, x, y, width, height, time) {

    ctx.save();

    ctx.translate(x, y);

    /*
        Each placeholder has a different appearance.
        This makes the movement extremely obvious.
    */

    if (clip.type === 0) {

        // Moving vertical stripes

        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(
            -width / 2,
            -height / 2,
            width,
            height
        );

        ctx.fillStyle = "#fff";

        const movement =
            (time * 0.35) % width;

        for (
            let i = -2;
            i < 8;
            i++
        ) {

            ctx.fillRect(
                i * 100 + movement,
                -height / 2,
                35,
                height
            );
        }

    } else if (clip.type === 1) {

        // Blue moving circles

        ctx.fillStyle = "#287bff";

        ctx.fillRect(
            -width / 2,
            -height / 2,
            width,
            height
        );

        ctx.fillStyle = "#fff";

        const movement =
            (time * 0.25) % width;

        for (
            let i = -2;
            i < 8;
            i++
        ) {

            ctx.beginPath();

            ctx.arc(
                i * 120 + movement,
                Math.sin(time / 300 + i) * 50,
                45,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

    } else if (clip.type === 2) {

        // Green diagonal movement

        ctx.fillStyle = "#21c45a";

        ctx.fillRect(
            -width / 2,
            -height / 2,
            width,
            height
        );

        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 25;

        const movement =
            (time * 0.3) % 250;

        for (
            let i = -5;
            i < 10;
            i++
        ) {

            ctx.beginPath();

            ctx.moveTo(
                i * 150 + movement,
                -height
            );

            ctx.lineTo(
                i * 150 + 300 + movement,
                height
            );

            ctx.stroke();
        }

    } else if (clip.type === 3) {

        // Purple pulsing circles

        ctx.fillStyle = "#8b45ff";

        ctx.fillRect(
            -width / 2,
            -height / 2,
            width,
            height
        );

        const pulse =
            60 + Math.sin(time / 150) * 20;

        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            pulse,
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else if (clip.type === 4) {

        // Yellow moving blocks

        ctx.fillStyle = "#ffd43b";

        ctx.fillRect(
            -width / 2,
            -height / 2,
            width,
            height
        );

        ctx.fillStyle = "#111";

        const movement =
            (time * 0.45) % 300;

        for (
            let i = -3;
            i < 8;
            i++
        ) {

            ctx.fillRect(
                i * 140 + movement,
                -80,
                80,
                160
            );
        }

    } else {

        // Black / white bouncing pattern

        ctx.fillStyle = "#111";

        ctx.fillRect(
            -width / 2,
            -height / 2,
            width,
            height
        );

        ctx.fillStyle = "#fff";

        const bounce =
            Math.sin(time / 180) * 100;

        ctx.beginPath();

        ctx.arc(
            bounce,
            0,
            70,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* Clip label */

    ctx.fillStyle = "rgba(0,0,0,0.35)";

    ctx.fillRect(
        -width / 2,
        -height / 2,
        width,
        55
    );

    ctx.fillStyle = "#fff";

    ctx.font =
        "bold 25px Arial";

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    ctx.fillText(
        clip.name,
        -width / 2 + 20,
        -height / 2 + 28
    );

    ctx.restore();
}


/* =========================================================
   4/3 MASK
========================================================= */

function draw43Mask(width, height) {

    ctx.font =
        `900 ${height * 0.78}px Arial Black, Arial, sans-serif`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#fff";

    ctx.fillText(
        "4/3",
        width / 2,
        height / 2
    );
}


/* =========================================================
   PATH THROUGH THE 4/3
========================================================= */

/*
    The first point is deliberately DEEP inside
    the upper part of the 4.

    This is where the animation starts.

    Then we travel around the shape.
*/

const path = [

    // Start inside the 4
    { x: 0.16, y: 0.18 },

    // Move across the top
    { x: 0.38, y: 0.18 },

    // Down through the 4
    { x: 0.30, y: 0.43 },

    // Across
    { x: 0.55, y: 0.48 },

    // Down toward the 3
    { x: 0.70, y: 0.62 },

    // Final movement
    { x: 0.82, y: 0.78 }
];


/* =========================================================
   EASING
========================================================= */

function easeInOut(t) {

    return (
        t < 0.5
            ? 4 * t * t * t
            : 1 -
              Math.pow(-2 * t + 2, 3) / 2
    );
}


/*
    Used specifically for the acceleration
    of clip switching.
*/

function acceleration(t) {

    return Math.pow(t, 3.2);
}


/* =========================================================
   MAIN ANIMATION
========================================================= */

let animationStart = null;

function render(timestamp) {

    if (animationStart === null) {
        animationStart = timestamp;
    }

    const elapsed =
        timestamp - animationStart;

    const progress =
        Math.min(
            elapsed / INTRO_DURATION,
            1
        );


    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    /* -----------------------------------------------------
       BACKGROUND
    ----------------------------------------------------- */

    ctx.clearRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );


    /* -----------------------------------------------------
       SIZE OF THE 4/3
    ----------------------------------------------------- */

    const logoWidth =
        Math.min(
            screenWidth * 0.70,
            1000
        );

    const logoHeight =
        Math.min(
            screenHeight * 0.70,
            750
        );


    /* -----------------------------------------------------
       CAMERA ZOOM
       
       IMPORTANT:
       Starts VERY close.
    ----------------------------------------------------- */

    const zoomProgress =
        easeInOut(progress);

    const START_ZOOM = 8.5;
    const END_ZOOM = 1;

    const zoom =
        START_ZOOM +
        (END_ZOOM - START_ZOOM)
        * zoomProgress;


    /* -----------------------------------------------------
       CAMERA START POSITION
       
       We start inside the 4.
    ----------------------------------------------------- */

    const cameraStartX =
        logoWidth * 0.16;

    const cameraStartY =
        logoHeight * 0.18;


    /*
        Slowly move camera from the starting point
        toward the centre as we zoom out.
    */

    const cameraX =
        cameraStartX +
        (
            logoWidth / 2 -
            cameraStartX
        ) * zoomProgress;

    const cameraY =
        cameraStartY +
        (
            logoHeight / 2 -
            cameraStartY
        ) * zoomProgress;


    /* -----------------------------------------------------
       CLIP SPEED
    ----------------------------------------------------- */

    const speed =
        acceleration(progress);


    /*
        Number of times we've travelled
        through the path.

        Very slow initially.
        Ridiculously fast near the end.
    */

    const pathProgress =
        speed * (path.length - 1);

    const pathIndex =
        Math.min(
            Math.floor(pathProgress),
            path.length - 2
        );

    const localProgress =
        pathProgress - pathIndex;


    const pointA =
        path[pathIndex];

    const pointB =
        path[pathIndex + 1];


    const clipX =
        pointA.x +
        (
            pointB.x -
            pointA.x
        ) * localProgress;

    const clipY =
        pointA.y +
        (
            pointB.y -
            pointA.y
        ) * localProgress;


    /* -----------------------------------------------------
       CLIP SWITCHING
    ----------------------------------------------------- */

    /*
        The number gets increasingly large,
        meaning the clips switch faster and faster.
    */

    const clipSwitches =
        Math.floor(
            progress * progress * 45
        );

    const currentClip =
        clips[
            clipSwitches % clips.length
        ];


    /* -----------------------------------------------------
       CAMERA TRANSFORM
    ----------------------------------------------------- */

    ctx.save();

    ctx.translate(
        screenWidth / 2,
        screenHeight / 2
    );

    ctx.scale(
        zoom,
        zoom
    );

    /*
        Move the camera around the 4/3.
    */

    ctx.translate(
        -cameraX,
        -cameraY
    );


    /* -----------------------------------------------------
       VIDEO LAYER
    ----------------------------------------------------- */

    ctx.save();

    /*
        Clip ONLY the moving footage to 4/3.
    */

    drawClip(
        currentClip,

        clipX * logoWidth,
        clipY * logoHeight,

        logoWidth * 0.60,
        logoHeight * 0.65,

        Math.sin(elapsed / 300) * 0.02
    );


    /*
        When things become fast,
        briefly layer another clip in.
    */

    if (progress > 0.45) {

        const secondClip =
            clips[
                (clipSwitches + 1)
                % clips.length
            ];

        drawClip(
            secondClip,

            clipX * logoWidth +
            Math.sin(elapsed / 70) * 100,

            clipY * logoHeight,

            logoWidth * 0.55,
            logoHeight * 0.60,

            -0.02
        );
    }


    /* -----------------------------------------------------
       MASK
    ----------------------------------------------------- */

    ctx.globalCompositeOperation =
        "destination-in";

    draw43Mask(
        logoWidth,
        logoHeight
    );

    ctx.restore();


    /* -----------------------------------------------------
       CAMERA RESTORE
    ----------------------------------------------------- */

    ctx.restore();


    /* -----------------------------------------------------
       FINAL TRANSITION
    ----------------------------------------------------- */

    /*
        NO FLASH.

        NO SECOND 4/3.

        Instead, the footage itself fades
        into ONE clean white 4/3.
    */

    if (progress > 0.86) {

        const fade =
            (progress - 0.86) / 0.14;

        ctx.save();

        ctx.globalAlpha =
            Math.min(
                fade,
                1
            );

        ctx.font =
            `900 ${Math.min(screenWidth, screenHeight) * 0.32}px Arial Black, Arial, sans-serif`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#fff";

        ctx.fillText(
            "4/3",
            screenWidth / 2,
            screenHeight / 2
        );

        ctx.restore();
    }


    /* -----------------------------------------------------
       LOOP
    ----------------------------------------------------- */

    if (progress < 1) {

        requestAnimationFrame(render);

    } else {

        /*
            Final frame:
            one clean white 4/3.
        */

        ctx.clearRect(
            0,
            0,
            screenWidth,
            screenHeight
        );

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            screenWidth,
            screenHeight
        );

        ctx.font =
            `900 ${Math.min(screenWidth, screenHeight) * 0.32}px Arial Black, Arial, sans-serif`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#fff";

        ctx.fillText(
            "4/3",
            screenWidth / 2,
            screenHeight / 2
        );
    }
}


/* =========================================================
   START
========================================================= */

startScreen.addEventListener(
    "click",
    () => {

        startScreen.classList.add("hidden");

        animationStart = null;

        requestAnimationFrame(render);
    }
);

</script>

</body>
</html>
